<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Shop the SMH Collections edit of clothing, accessories, footwear and home essentials."><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><title>Shop All | SMH Collections</title><link rel="stylesheet" href="css/style.css"><script src="js/api.js" defer></script><script src="js/app.js" defer></script><script src="js/products.js" defer></script></head>
<body data-page="shop"><div id="site-header"></div><main>
  <section class="shop-header"><div class="container"><span class="section-label">The full collection</span><h1>Find your everyday.</h1><p>A considered mix of pieces for getting dressed, getting out the door and settling in at home.</p></div></section>
  <section class="section"><div class="container">
    <div class="shop-toolbar"><div><p><span data-results-count>Loading items…</span></p></div><div class="shop-filters"><div class="cluster" data-category-filters aria-label="Filter by category"></div><select id="shop-sort" class="sort-select" aria-label="Sort products"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="name">Name A–Z</option></select></div></div>
    <form class="search-form" id="shop-search" role="search"><input id="shop-search-input" type="search" maxlength="100" placeholder="Search the collection…" aria-label="Search products"><button type="submit">Search</button></form>
    <div class="product-grid" id="shop-products" style="margin-top:25px"><p class="loading-state">Loading the collection…</p></div>
  </div></section>
</main><div id="site-footer"></div></body></html>
